name: "Navidrome Rating Sync"
version: "1.0.3"
slug: "subsonic-rating-sync"
description: "Syncing 5-star ratings and favorites (LOVE RATING) between audio files and Navidrome. Supported sync modes: two-way, one-way (Files → Navidrome), or (Navidrome → Files)."
url: "https://github.com/theodorx7/ha-subsonic-rating-sync"
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
#hassio_api: true
#homeassistant_api: true
map:
  - media:rw
  - share:rw

options:
  server_protocol: "https"
  server_host: "musicfx.duckdns.org"
  server_port: 4533
  user: "test"
  password: "test"
  music_folder_id: "2"  # ID of the Music Library on the Subsonic server 
  dry_run: false
  sync_mode: "two-way"
  conflict_resolution: "server_wins"
  sync_schedule_type: "interval"
  sync_interval_hours: 24
  sync_time: "03:00"
  atomic_save: false
  debug: true
schema:
  server_protocol: list(https|http)
  server_host: str
  server_port: int?
  user: str
  password: password
  music_folder_id: str  # ID of the Music Library on the Subsonic server
  dry_run: bool
  sync_mode: list(two-way|file-to-server|server-to-file)
  conflict_resolution: list(server_wins|file_wins)
  sync_schedule_type: list(off|interval|daily)
  sync_interval_hours: int?
  sync_time: str?
  atomic_save: bool
  debug: bool
  
