name: "Home Assistant App: Syncing rating/favorite/like tags between audio files and Navidrome — Subsonic/Opensonic API"
version: "1.0.0"
slug: "subsonic-rating-sync"
description: "Syncing rating/favorite/like tags between audio files and Navidrome (Subsonic/Opensonic API). Supported sync modes: two-way, one-way (Files → Navidrome), or (Navidrome → Files)."
url: "https://github.com/theodorx7/ha-subsonic-rating-sync"
arch:
  - aarch64
  - amd64
init: false
startup: application # или нужно задать значение services ?
boot: auto
map:
  - share:rw
options:
  navidrome_url: "https://musicfx.duckdns.org:4533/"
  navidrome_user: "fedor"
  navidrome_password: ""
  music_folder: "/media/MUSIC"
  sync_interval_minutes: 60
  conflict_resolution: "server_wins"
  dry_run: false

  debug: false

schema:
  navidrome_url: str
  navidrome_user: str
  navidrome_password: password
  music_folder: str
  sync_interval_minutes: int
  conflict_resolution: list(server_wins|file_wins)
  dry_run: bool

  debug: bool
  




