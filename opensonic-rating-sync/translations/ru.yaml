configuration:
  server_protocol:
    name: Протокол подключения
    description: >-
      Протокол доступа к серверу Navidrome. Рекомендуется использовать HTTPS для удаленных подключений. HTTP допустим только в защищенной локальной сети.
  server_host:
    name: Адрес сервера
    description: >-
      IP-адрес или доменное имя сервера без указания протокола и порта (например, 192.168.1.100 или music.duckdns.org).
  server_port:
    name: Порт сервера
    description: >-
      Порт для подключения к API. По умолчанию для Navidrome используется 4533. Поле можно оставить пустым, если используется стандартный порт протокола (80 или 443).
  user:
    name: Имя пользователя
    description: >-
      Учетная запись на сервере Navidrome. У пользователя должны быть права на чтение медиатеки и изменение оценок.
  password:
    name: Пароль
    description: >-
      Пароль от учетной записи Navidrome. Аутентификация выполняется по защищенной схеме token+salt, пароль в открытом виде не передается.
  music_folder_id:
    name: Идентификатор медиатеки
    description: >-
      ID конкретной музыкальной папки на сервере. Точное указание ID ускоряет синхронизацию, так как скрипт не сканирует лишние директории.
  sync_mode:
    name: Направление синхронизации
    description: >-
      Двунаправленная (two-way) синхронизация по умолчанию. Режим file-to-server перезаписывает оценки на сервере данными из файлов. Режим server-to-file перезаписывает теги в файлах оценками с сервера.
  conflict_resolution:
    name: Стратегия разрешения конфликтов
    description: >-
      Определяет приоритет при одновременном изменении оценки в файле и на сервере с одинаковыми метками времени (только для двунаправленного режима). Сервер (server_wins) или файл (file_wins).
  sync_schedule_type:
    name: Режим запуска
    description: >-
      off — только ручной запуск или по команде из Home Assistant. interval — запуск каждые N часов. daily — ежедневный запуск в строго заданное время.
  sync_interval_hours:
    name: Интервал запуска (в часах)
    description: >-
      Периодичность автоматической синхронизации в часах. Применяется только при выбранном режиме запуска interval.
  sync_time:
    name: Время ежедневного запуска
    description: >-
      Время запуска синхронизации в формате ЧЧ:ММ или ЧЧ:ММ:СС (например, 03:00). Применяется только при выбранном режиме запуска daily.
  sync_ratings:
    name: Синхронизация оценок (звезды)
    description: >-
      Включает синхронизацию рейтингов (1-5 звезд). При отключении оценки замораживаются: скрипт игнорирует изменения и не перезаписывает теги, предотвращая ложные конфликты.
  sync_likes:
    name: Синхронизация избранного (лайки)
    description: >-
      Включает синхронизацию отметок «Избранное» (сердечки). При отключении статусы лайков замораживаются в текущем состоянии и не перезаписываются.
  dry_run:
    name: Тестовый режим (Dry-Run)
    description: >-
      Режим безопасной симуляции: скрипт вычисляет и выводит планируемые изменения в журнал, но не вносит физических правок в файлы и на сервер. Рекомендуется для первичной проверки.
  atomic_save:
    name: Безопасная запись файлов
    description: >-
      Атомарная запись (Copy-Save-Replace), гарантирующая защиту от порчи файлов при сбоях сети или питания. Настоятельно рекомендуется для медиатек, доступных по сети (SMB/NFS). Выключено по умолчанию для снижения износа локальных SSD.
  debug:
    name: Подробное логирование (Debug)
    description: >-
      Включает расширенное логирование процессов: чтение тегов, разрешение конфликтов и метки времени. Полезно для диагностики ошибок, но увеличивает объем журнала.
