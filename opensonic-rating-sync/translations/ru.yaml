configuration:
  server_protocol:
    name: Протокол подключения
  server_host:
    name: Адрес сервера
    description: >-
      IP-адрес или доменное имя без http:// и порта.
  server_port:
    name: Порт подключения
    description: >-
      По умолчанию для Navidrome — 4533. Можно оставить пустым, если используется порт 80 или 443.
  user:
    name: Имя пользователя
    description: >-
      Укажите аккаунт, с которого вы ставите оценки трекам. В Navidrome рейтинги привязаны к конкретному пользователю.
  password:
    name: Пароль
    description: >-
      Аутентификация по схеме token+salt. Пароль не передается в открытом виде.
  music_folder_id:
    name: ID медиатеки на сервере
    description: >-
      Если библиотека одна, обычно это 1. Узнать ID можно в Navidrome: раздел "Libraries" —> Откройте настройки нужной библиотеки —> Цифра в конце URL (например, "/#/library/1").
  sync_mode:
    name: Направление синхронизации
    description: >-
      Двунаправленная синхронизация объединяет данные. Односторонняя file-to-server перезаписывает оценки на сервере данными из файлов, server-to-file перезаписывает теги в файлах оценками с сервера.
  conflict_resolution:
    name: Разрешение конфликтов
    description: >-
      Только для режима two-way. Определяет приоритет (сервер или файл), если оценка изменена в обоих местах одновременно.
  sync_schedule_type:
    name: Режим запуска
    description: >-
      off — только ручной запуск или по команде из Home Assistant, interval — каждые N часов, daily — ежедневно в заданное время.
  sync_interval_hours:
    name: Интервал запуска в часах
    description: >-
      Только для режима interval. Минимум 1 час (только целые значения).
  sync_time:
    name: Время ежедневного запуска
    description: >-
      Только для режима daily. Формат времени: ЧЧ:ММ или ЧЧ:ММ:СС.
  sync_ratings:
    name: Синхронизировать рейтинг
    description: >-
      Рейтинг 1-5 звезд.
  sync_likes:
    name: Синхронизировать лайки
    description: >-
      Избранное / Лайки в формате MusicBee.
  dry_run:
    name: Тестовый режим синхронизации (Dry-Run)
    description: >-
      Имитация работы: планируемые изменения выводятся в журнал, но файлы и сервер не затрагиваются. Рекомендуется для первой проверки.
  atomic_save:
    name: Атомарная запись файлов (сохранение тегов) 
    description: >-
      Гарантирует защиту от порчи файлов при многопользовательском доступе к аудиофайлам или сбоях сети/питания. Рекомендуется, если медиатека доступна по сети (SMB/NFS). Выключено по умолчанию для снижения износа SSD. 
  debug:
    name: Debug логирование

