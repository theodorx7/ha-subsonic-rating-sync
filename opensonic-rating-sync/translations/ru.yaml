configuration:
  server_protocol:
    name: Протокол подключения
    description:
  server_host:
    name: Адрес сервера
    description: >-
      IP-адрес или доменное имя сервера без указания протокола и порта.
  server_port:
    name: Порт подключения
    description: >-
      Для Navidrome по умолчанию используется 4533. Оставить поле пустым, если вы используете стандартный порт 80 или 443.
  user:
    name: Имя пользователя
    description: >-
      Авторизуйтесь под аккаунтом, с которого вы слушаете музыку и оцениваете треки. Данные о рейтингах и лайках на сервере сохраняются индивидуально для каждого пользователя.
  password:
    name: Пароль
    description: >-
      Аутентификация выполняется по защищенной схеме token+salt, пароль в открытом виде не передается.
  music_folder_id:
    name: ID медиатеки на сервере
    description: >-
      Если в Navidrome библиотека только одна, то обычно это 1. В меню Navidrome откройте раздел "Libraries" ---> Откройте настройки нужной библиотеки ---> В URL будет ID библиотеке, например, "/#/library/1".
  sync_mode:"
    name: Направление синхронизации
    description: >-
      Двунаправленная синхронизация объединяет данные. Одностороняя file-to-server перезаписывает оценки на серве данными из файлов. Режим server-to-file перезаписывает теги в файлах оценками с сервера.
  conflict_resolution:
    name: Разрешения конфликтов
    description: >-
      Только для двунаправленной синхронизации: Определяет приоритет при одновременном изменении оценки в файле и на сервере с одинаковыми метками времени.
  sync_schedule_type:
    name: Режим запуска
    description: >-
      off — только ручной запуск или по команде из Home Assistant. interval — запуск каждые N часов. daily — ежедневный запуск в строго заданное время.
  sync_interval_hours:
    name: Интервал запуска в часах
    description: >-
      Применяется только при выбранном режиме запуска interval. Минимально 1 час. Поддерживаются целые значения без указания минут.
  sync_time:
    name: Время ежедневного запуска
    description: >-
       Применяется только при выбранном режиме запуска daily. Время запуска синхронизации в формате ЧЧ:ММ или ЧЧ:ММ:СС.
  sync_ratings:
    name: Синхронизировать рейтинг
    description: >-
      Рейтинг 1-5 звезд.
  sync_likes:
    name: Синхронизировать лайки
    description: >-
      Изабранное/Лайки в формате MusicBee.
  dry_run:
    name: Тестовый режим синхронизации (Dry-Run)
    description: >-
      Только чтение данных без записи. В журнал выводятся планируемые изменения, но не записываются на сервер или файлы. Рекомендуется для первичной проверки.
  atomic_save:
    name: Атомарная запись файлов (сохранение тегов) 
    description: >-
      Гарантирующая защиту от порчи файлов при сбоях сети или питания. Рекомендуется если медиатека, доступна по сети (SMB/NFS). Выключено по умолчанию для снижения износа SSD. 
  debug:
    name: Debug логирование
    description:
