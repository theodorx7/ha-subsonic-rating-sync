configuration:
  server_protocol:
    name: Протокол сервера
    description: >-
      Протокол подключения к серверу Navidrome. Используйте https для безопасного удаленного подключения или http для локальной сети.
  server_host:
    name: Адрес сервера
    description: >-
      IP-адрес или доменное имя сервера Navidrome без указания протокола и порта (например, 192.168.1.100 или music.duckdns.org).
  server_port:
    name: Порт сервера
    description: >-
      Порт для подключения к API. Стандартный порт Navidrome — 4533. Оставьте пустым, если используется стандартный порт протокола (80 или 443).
  user:
    name: Имя пользователя
    description: >-
      Логин пользователя на сервере Navidrome (Subsonic). У пользователя должны быть права на чтение медиатеки и изменение оценок.
  password:
    name: Пароль
    description: >-
      Пароль пользователя для доступа к серверу. Аутентификация происходит по безопасной схеме token+salt (пароль в открытом виде не передается).
  music_folder_id:
    name: ID медиатеки
    description: >-
      Идентификатор музыкальной папки (библиотеки) на сервере. Можно узнать в настройках Navidrome. Указание конкретного ID ускоряет синхронизацию, так как скрипт не сканирует все доступные папки.
  sync_mode:
    name: Режим синхронизации
    description: >-
      Направление синхронизации. "two-way" — двунаправленная (по умолчанию). "file-to-server" — перезаписывать оценки на сервере данными из файлов. "server-to-file" — перезаписывать теги в файлах оценками с сервера.
  conflict_resolution:
    name: Разрешение конфликтов
    description: >-
      Стратегия при одновременном изменении оценки и в файле, и на сервере (только для режима two-way). При равных метках времени победителем будет назначен сервер ("server_wins") или файл ("file_wins").
  sync_schedule_type:
    name: Тип расписания
    description: >-
      "off" — запуск только вручную кнопкой или автоматизацией HA. "interval" — запуск каждые N часов. "daily" — ежедневный запуск строго в указанное время (например, ночью).
  sync_interval_hours:
    name: Интервал запуска (в часах)
    description: >-
      Периодичность автоматического запуска синхронизации в часах. Используется только при выбранном типе расписания "interval".
  sync_time:
    name: Время ежедневного запуска
    description: >-
      Время запуска синхронизации в формате ЧЧ:ММ или ЧЧ:ММ:СС (например, 03:00:00). Используется только при выбранном типе расписания "daily".
  sync_ratings:
    name: Синхронизировать рейтинги (звезды)
    description: >-
      Включить синхронизацию оценок (1-5 звезд). При отключении опции рейтинги "замораживаются": скрипт не будет перезаписывать существующие оценки, исключая ложные конфликты.
  sync_likes:
    name: Синхронизировать избранное (лайки)
    description: >-
      Включить синхронизацию отметок "Избранное" (сердечки). При отключении опции статусы лайков "замораживаются" в текущем состоянии и не перезаписываются.
  dry_run:
    name: Тестовый запуск (Dry-Run)
    description: >-
      Режим безопасной симуляции. Скрипт вычисляет и выводит в лог все планируемые изменения, но физически не трогает аудиофайлы и базу сервера. Идеально для первой проверки.
  atomic_save:
    name: Атомарная запись файлов
    description: >-
      100% защита от бинарной порчи файлов при сбоях сети и питания (Copy-Save-Replace). Крайне рекомендуется включить для медиатек, доступных по сети (SMB/NFS). Для локальных дисков выключено по умолчанию для экономии ресурса SSD.
  debug:
    name: Подробное логирование (Debug)
    description: >-
      Вывод в журнал расширенной информации о работе алгоритмов (чтение тегов, метки времени, конфликты LWW). Полезно для диагностики, но увеличивает размер логов.
