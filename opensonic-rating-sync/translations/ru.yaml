configuration:
  server_protocol:
    name: Протокол подключения
  server_host:
    name: Адрес сервера
    description: >-
      IP-адрес или доменное имя без указания http:// и порта.
  server_port:
    name: Порт
    description: >-
      По умолчанию для Navidrome — 4533. Можно оставить пустым, если используется порт 80 или 443.
  user:
    name: Имя пользователя
    description: >-
      Укажите аккаунт, с которого вы ставите оценки трекам. В Navidrome рейтинги привязаны к конкретному пользователю.
  password:
    name: Пароль
    description: >-
      Аутентификация по схеме token+salt. Пароль не передается в открытом виде.
  music_folder_id:
    name: ID медиатеки на сервере
    description: >-
      Для Navidrome: если библиотека одна, то обычно это 1. Как узнать ID: в меню откройте раздел "Libraries" —> Откройте настройки нужной библиотеки —> Цифра в конце URL (например, "/#/library/1").
  sync_mode:
    name: Направление синхронизации
    description: >-
      Двунаправленная синхронизация объединяет данные. Односторонняя file-to-server перезаписывает оценки на сервере данными из файлов, server-to-file перезаписывает теги в файлах оценками с сервера.
  conflict_resolution:
    name: Разрешение конфликтов
    description: >-
      Применяется только для режима two-way и определяет приоритет источника (сервер или файл), если оценка изменена в обоих местах одновременно и при этом совпадает время изменения.
  sync_schedule_type:
    name: Режим запуска
    description: >-
      off — запуск только по команде из Home Assistant, interval — каждые N часов, daily — ежедневно в заданное время.
  sync_interval_hours:
    name: Интервал запуска в часах
    description: >-
      Только для режима interval. Минимум 1 час и только целые значения без указания минут.
  sync_time:
    name: Время ежедневного запуска
    description: >-
      Применяется только для режима daily. Формат времени: ЧЧ:ММ или ЧЧ:ММ:СС.
  sync_ratings:
    name: Синхронизировать рейтинги
    description: >-
      Звездный рейтинг (значения от 1 до 5).
  sync_likes:
    name: Синхронизировать лайки
    description: >-
      Лайки в формате MusicBee (бинарное избранное).
  dry_run:
    name: Тестовый режим синхронизации (Dry-Run)
    description: >-
      Имитация синхронизации без записи данных. Все планируемые изменения только выводятся в журнал (лог). Используйте для первого запуска или для проверки настроек синхронизации.
  atomic_save:
    name: Атомарная запись файлов (сохранение тегов)
    description: >-
      Защищает аудиофайлы от повреждения при параллельной записи разными программами и сбоях (нестабильная сеть/сбой питания). Рекомендуется для сетевых хранилищ (SMB/NFS). По умолчанию отключено для экономии ресурса SSD.
  debug:
    name: Debug-логирование

